name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    env:
      E2E_TELEMETRY_DISABLED: "1"
      TZ: Pacific/Kiritimati
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - parallel:
          - name: Check privacy boundary
            run: pnpm check:privacy

          - name: Lint
            run: pnpm lint

          - name: Check formatting
            run: pnpm format:check

          - name: Typecheck
            run: pnpm run typecheck

          - name: Behavioral regression tests
            run: pnpm test:run

          - name: Build
            run: pnpm build

      - name: Install browser
        run: pnpm exec e2e-web install chromium --with-deps

      - name: End-to-end planning journey
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: .e2e/
          include-hidden-files: true

      - name: Prove regressions fail on the audited baseline
        shell: bash
        run: |
          cp lib/timeline-events.ts /tmp/fixed-timeline.ts
          cp components/webmcp/trip-web-mcp.tsx /tmp/fixed-webmcp.tsx
          trap 'cp /tmp/fixed-timeline.ts lib/timeline-events.ts; cp /tmp/fixed-webmcp.tsx components/webmcp/trip-web-mcp.tsx' EXIT
          git show 5f6845f:lib/timeline-events.ts > lib/timeline-events.ts
          git show 5f6845f:components/webmcp/trip-web-mcp.tsx > components/webmcp/trip-web-mcp.tsx
          if pnpm exec vitest run test/timeline-date.test.ts > /tmp/timeline-repro.log 2>&1; then
            cat /tmp/timeline-repro.log
            echo 'Expected baseline date regression to fail'
            exit 1
          fi
          cat /tmp/timeline-repro.log
          grep -F 'Tuesday, Sep 08' /tmp/timeline-repro.log
          grep -F 'expected 480 to be 660' /tmp/timeline-repro.log
          if pnpm exec vitest run test/webmcp.test.tsx > /tmp/webmcp-repro.log 2>&1; then
            cat /tmp/webmcp-repro.log
            echo 'Expected baseline invalid-input regression to fail'
            exit 1
          fi
          cat /tmp/webmcp-repro.log
          grep -E 'promise resolved.*instead of rejecting' /tmp/webmcp-repro.log
